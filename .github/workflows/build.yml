name: build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  # Tests du noyau portable : ne necessitent ni SDK LeviLamina ni Windows.
  # C'est la suite principale de verification (kinetique + monde + pont).
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler et executer les tests du noyau
        run: python3 Tools/run_tests.py

  # Build du mod natif Windows pour LeviLamina (necessite le SDK via xmake).
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type:
          - client
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows -v --target_type=${{ matrix.target_type }} -y

      - run: xmake -v -y

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: bin/
          if-no-files-found: warn
