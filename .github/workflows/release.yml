name: release

# Construit le mod natif Windows et joint les fichiers à une release publiee.
# Declenchement : publication d'une release GitHub (tag vX.Y.Z).
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex: v0.1.0)"
        required: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type:
          - client
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows -v --target_type=${{ matrix.target_type }} -y

      - run: xmake -v -y

      - uses: actions/upload-artifact@v4
        with:
          name: CreateLeviLamina-${{ matrix.target_type }}-windows-x64
          path: bin/

  upload-to-release:
    needs: build
    permissions:
      contents: write
    strategy:
      matrix:
        target_type:
          - client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CreateLeviLamina-${{ matrix.target_type }}-windows-x64
          path: artifact

      - run: cp README.md INSTALL.md CHANGELOG.md LICENSE artifact/

      - run: zip -r ../CreateLeviLamina-${{ matrix.target_type }}-windows-x64.zip *
        working-directory: artifact

      - uses: softprops/action-gh-release@v2
        with:
          files: CreateLeviLamina-${{ matrix.target_type }}-windows-x64.zip

  # Empaquette l'addon data-driven (BP + RP) et le joint a la release.
  addon:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer la structure de l'addon
        run: python3 Tools/generate_data.py --out Resources

      - name: Empaqueter
        run: python3 Tools/package.py --out dist

      - run: cp dist/CreateLeviLamina_0.1.0.zip dist/CreateLeviLamina-addon.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/CreateLeviLamina-addon.zip
